name: Build giuliac LineageOS kernel

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout kernel
        uses: actions/checkout@v4
        with:
          path: kernel
          fetch-depth: 1

      - name: Checkout sm8650 modules
        uses: actions/checkout@v4
        with:
          repository: LineageOS/android_kernel_oneplus_sm8650-modules
          ref: lineage-23.2
          path: sm8650-modules
          fetch-depth: 1

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            bc bison build-essential ccache curl flex git libelf-dev \
            libssl-dev lld llvm clang python3 rsync unzip zip dwarves

      - name: Show kernel version
        run: |
          cd kernel
          head -5 Makefile
          ls -l drivers/base/kernelFwUpdate || true
          ls -l ../sm8650-modules/oplus/kernel/touchpanel/kernelFwUpdate/Kconfig || true

      - name: Configure kernel
        run: |
          cd kernel
          echo '' > .scmversion
          make O=out ARCH=arm64 LLVM=1 LLVM_IAS=1 \
            gki_defconfig \
            vendor/pineapple_GKI.config \
            vendor/oplus/pineapple_GKI.config
          ./scripts/config --file out/.config \
            --set-str LOCALVERSION "-g638ecc425319" \
            --disable LOCALVERSION_AUTO
          make O=out ARCH=arm64 LLVM=1 LLVM_IAS=1 olddefconfig
          echo '--- kernel release ---'
          make O=out ARCH=arm64 LLVM=1 LLVM_IAS=1 kernelrelease
          echo '--- docker related config ---'
          grep -E 'CONFIG_(LOCALVERSION|LOCALVERSION_AUTO|UTS_NS|IPC_NS|PID_NS|USER_NS|NET_NS|CGROUP_DEVICE|CGROUP_PIDS|CHECKPOINT_RESTORE|BRIDGE_NETFILTER|NETFILTER_XT_MATCH_ADDRTYPE|OVERLAY_FS|VETH|TUN|BRIDGE)=' out/.config || true

      - name: Build Image
        run: |
          cd kernel
          make O=out ARCH=arm64 LLVM=1 LLVM_IAS=1 -j$(nproc) Image

      - name: Verify Image
        run: |
          cd kernel
          file out/arch/arm64/boot/Image
          strings out/arch/arm64/boot/Image | grep -m1 'Linux version' || true
          cp out/arch/arm64/boot/Image ../Image
          cp out/.config ../kernel.config

      - name: Build clean AnyKernel3 package
        run: |
          set -e
          curl -L -o AnyKernel3.zip https://github.com/osm0sis/AnyKernel3/archive/refs/heads/master.zip
          unzip -q AnyKernel3.zip
          mv AnyKernel3-master AK_CLEAN
          find AK_CLEAN -maxdepth 1 -type f \( -name 'Image*' -o -name '*.dtb' -o -name '*.dtbo' -o -name '*.ko' \) -delete
          rm -rf AK_CLEAN/.git AK_CLEAN/.github AK_CLEAN/modules AK_CLEAN/patch AK_CLEAN/ramdisk
          cp Image AK_CLEAN/Image
          cat > AK_CLEAN/anykernel.sh <<'EOF'
          ### AnyKernel3 clean ramdisk mod script
          # OnePlus Ace 5 / OP5D2BL1 / PKG110 / LineageOS 23.2 / Android 16
          # Kernel-only package: replaces boot kernel Image and preserves current ramdisk.

          properties() { '
          kernel.string=LineageOS 6.1.174 Docker/OCI clean kernel by mg13666
          do.devicecheck=0
          do.modules=0
          do.systemless=1
          do.cleanup=1
          do.cleanuponabort=0
          device.name1=OP5D2BL1
          device.name2=PKG110
          device.name3=giuliac
          device.name4=oneplus_ace5_b
          supported.versions=16
          supported.patchlevels=
          '; }

          block=boot
          is_slot_device=auto
          ramdisk_compression=auto
          patch_vbmeta_flag=auto

          . tools/ak3-core.sh

          split_boot
          write_boot
          flash_boot
          EOF
          sed -i 's/^          //' AK_CLEAN/anykernel.sh
          sh -n AK_CLEAN/anykernel.sh
          cd AK_CLEAN
          zip -qr9 ../AnyKernel3_CLEAN_LineageOS_6.1.174_Docker_OnePlusAce5.zip . -x 'README.md' 'LICENSE' '*.git*'
          cd ..
          unzip -t AnyKernel3_CLEAN_LineageOS_6.1.174_Docker_OnePlusAce5.zip
          sha256sum AnyKernel3_CLEAN_LineageOS_6.1.174_Docker_OnePlusAce5.zip > AnyKernel3_CLEAN_LineageOS_6.1.174_Docker_OnePlusAce5.zip.sha256
          echo '--- AK write ops ---'
          grep -nE 'block=|write_boot|flash_boot|vendor_boot|init_boot|dtbo|do.modules|device.name|do.devicecheck' AK_CLEAN/anykernel.sh || true

      - name: Upload clean AnyKernel3 package
        uses: actions/upload-artifact@v4
        with:
          name: AnyKernel3_CLEAN_LineageOS_6.1.174_Docker_OnePlusAce5
          path: |
            AnyKernel3_CLEAN_LineageOS_6.1.174_Docker_OnePlusAce5.zip
            AnyKernel3_CLEAN_LineageOS_6.1.174_Docker_OnePlusAce5.zip.sha256

      - name: Upload debug files
        uses: actions/upload-artifact@v4
        with:
          name: giuliac-lineage-6.1.174-docker-debug
          path: |
            Image
            kernel.config
