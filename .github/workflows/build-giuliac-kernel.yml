name: Build giuliac LineageOS Docker kernel

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      EXPECTED_KERNEL_RELEASE: 6.1.174-g638ecc425319
      AK3_ZIP: AnyKernel3-LineageOS-6.1.174-Docker-Ace5.zip
      CLANG_VERSION: r563880c
      CLANG_COMMIT: f8439f0628d799092dd07df440a6334cab28939c

    steps:
      - name: Checkout kernel
        uses: actions/checkout@v4
        with:
          path: kernel
          fetch-depth: 1

      - name: Checkout sm8650 modules
        uses: actions/checkout@v4
        with:
          repository: LineageOS/android_kernel_oneplus_sm8650-modules
          ref: lineage-23.2
          path: sm8650-modules
          fetch-depth: 1

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            bc bison build-essential ccache curl file flex git libelf-dev \
            libssl-dev python3 rsync unzip zip dwarves xz-utils

      - name: Install exact LineageOS clang-r563880c build 14054515
        run: |
          mkdir -p "toolchain/${CLANG_VERSION}"
          curl -fL \
            "https://android.googlesource.com/platform/prebuilts/clang/host/linux-x86/+archive/${CLANG_COMMIT}/clang-${CLANG_VERSION}.tar.gz" \
            | tar -xz -C "toolchain/${CLANG_VERSION}"
          "toolchain/${CLANG_VERSION}/bin/clang" --version | tee clang-version.txt
          grep -q 'clang version 21.0.0' clang-version.txt
          grep -q 'r563880c' "toolchain/${CLANG_VERSION}/AndroidVersion.txt"
          test -f "toolchain/${CLANG_VERSION}/manifest_14054515.xml"

      - name: Configure kernel from LineageOS device settings
        run: |
          cd kernel
          export PATH="$GITHUB_WORKSPACE/toolchain/${CLANG_VERSION}/bin:$PATH"

          # This source tree's scripts/setlocalversion explicitly prefers
          # .scmversion over Git metadata. It therefore produces the exact
          # release used by the installed LineageOS kernel without a '+' suffix.
          printf '%s' '-g638ecc425319' > .scmversion

          MAKE_FLAGS=(
            O=out
            ARCH=arm64
            LLVM=1
            LLVM_IAS=1
            CONFIG_OPLUS_DEVICE_DTBS=y
            CONFIG_GIULIA_DTB=y
            CONFIG_GIULIAC_DTB=y
          )

          make "${MAKE_FLAGS[@]}" \
            gki_defconfig \
            vendor/pineapple_GKI.config \
            vendor/oplus/pineapple_GKI.config
          make "${MAKE_FLAGS[@]}" olddefconfig

          grep -q '^CONFIG_LOCALVERSION_AUTO=y$' out/.config
          grep -Fq 'based on r563880c) clang version 21.0.0' out/.config
          for option in \
            UTS_NS IPC_NS PID_NS USER_NS NET_NS \
            CGROUP_PIDS CGROUP_DEVICE CHECKPOINT_RESTORE \
            BRIDGE BRIDGE_NETFILTER NETFILTER_XT_MATCH_ADDRTYPE \
            OVERLAY_FS VETH TUN; do
            grep -q "^CONFIG_${option}=y$" out/.config || {
              echo "ERROR: CONFIG_${option}=y is required for Docker/OCI"
              exit 1
            }
          done

          RELEASE="$(make -s "${MAKE_FLAGS[@]}" kernelrelease)"
          echo "Kernel release: ${RELEASE}"
          test "${RELEASE}" = "${EXPECTED_KERNEL_RELEASE}" || {
            echo "ERROR: expected ${EXPECTED_KERNEL_RELEASE}, got ${RELEASE}"
            exit 1
          }

          echo '--- Docker/OCI-related config ---'
          grep -E 'CONFIG_(LOCALVERSION|LOCALVERSION_AUTO|UTS_NS|IPC_NS|PID_NS|USER_NS|NET_NS|CGROUP_DEVICE|CGROUP_PIDS|CHECKPOINT_RESTORE|BRIDGE_NETFILTER|NETFILTER_XT_MATCH_ADDRTYPE|OVERLAY_FS|VETH|TUN|BRIDGE)=' out/.config || true

      - name: Build Image with project clang
        run: |
          cd kernel
          export PATH="$GITHUB_WORKSPACE/toolchain/${CLANG_VERSION}/bin:$PATH"
          make O=out ARCH=arm64 LLVM=1 LLVM_IAS=1 \
            CONFIG_OPLUS_DEVICE_DTBS=y \
            CONFIG_GIULIA_DTB=y \
            CONFIG_GIULIAC_DTB=y \
            -j"$(nproc)" Image

      - name: Verify exact Image release
        run: |
          IMAGE=kernel/out/arch/arm64/boot/Image
          file "${IMAGE}"
          VERSION_LINE="$(strings "${IMAGE}" | grep -m1 'Linux version' || true)"
          echo "${VERSION_LINE}"
          printf '%s\n' "${VERSION_LINE}" | grep -Fq "Linux version ${EXPECTED_KERNEL_RELEASE} " || {
            echo "ERROR: Image release does not exactly match ${EXPECTED_KERNEL_RELEASE}"
            exit 1
          }
          ! printf '%s\n' "${VERSION_LINE}" | grep -Fq "${EXPECTED_KERNEL_RELEASE}+"
          cp "${IMAGE}" Image
          cp kernel/out/.config kernel.config

      - name: Build verified ARM64 AnyKernel3 package
        run: |
          curl -fL -o AnyKernel3.zip \
            https://github.com/osm0sis/AnyKernel3/archive/refs/heads/master.zip
          unzip -q AnyKernel3.zip
          mv AnyKernel3-master AK3

          find AK3 -maxdepth 1 -type f \( \
            -name 'Image*' -o -name '*.dtb' -o -name '*.dtbo' -o -name '*.ko' \
          \) -delete
          rm -rf AK3/.git AK3/.github AK3/modules AK3/patch AK3/ramdisk
          cp Image AK3/Image

          curl -fL -o AK3/tools/busybox \
            https://raw.githubusercontent.com/ReSukiSU/ReSukiSU/main/userspace/ksud/bin/aarch64/busybox
          curl -fL -o Magisk-v30.7.apk \
            https://github.com/topjohnwu/Magisk/releases/download/v30.7/Magisk-v30.7.apk
          unzip -p Magisk-v30.7.apk lib/arm64-v8a/libmagiskboot.so > AK3/tools/magiskboot

          cat > AK3/anykernel.sh <<'EOF'
          ### AnyKernel3 ramdisk mod script
          # OnePlus Ace 5 / OP5D2BL1 / PKG110 / LineageOS 23.2 / Android 16

          properties() { '
          kernel.string=LineageOS 6.1.174 Docker/OCI kernel by mg13666
          do.devicecheck=0
          do.modules=0
          do.systemless=1
          do.cleanup=1
          do.cleanuponabort=0
          device.name1=OP5D2BL1
          device.name2=PKG110
          device.name3=giuliac
          device.name4=oneplus_ace5_b
          supported.versions=
          supported.patchlevels=
          '; }

          BLOCK=boot;
          IS_SLOT_DEVICE=1;
          RAMDISK_COMPRESSION=auto;
          PATCH_VBMETA_FLAG=auto;
          NO_MAGISK_CHECK=1;
          NO_VBMETA_PARTITION_PATCH=1;

          . tools/ak3-core.sh

          split_boot
          flash_boot
          EOF
          sed -i 's/^          //' AK3/anykernel.sh

          chmod 755 \
            AK3/anykernel.sh \
            AK3/tools/busybox \
            AK3/tools/magiskboot \
            AK3/META-INF/com/google/android/update-binary

          sh -n AK3/anykernel.sh
          test -s AK3/LICENSE
          test -s AK3/Image
          test -s AK3/tools/busybox
          test -s AK3/tools/magiskboot
          file AK3/tools/busybox | grep -q 'ARM aarch64'
          file AK3/tools/magiskboot | grep -q 'ARM aarch64'
          grep -q '^BLOCK=boot;' AK3/anykernel.sh
          grep -q '^IS_SLOT_DEVICE=1;' AK3/anykernel.sh
          grep -q '^supported.versions=$' AK3/anykernel.sh
          ! grep -qE '^(block|is_slot_device|ramdisk_compression|patch_vbmeta_flag)=' AK3/anykernel.sh
          ! grep -q 'write_boot' AK3/anykernel.sh

          cd AK3
          zip -qr9 "../${AK3_ZIP}" . -x 'README.md' '*.git*'
          cd ..
          unzip -t "${AK3_ZIP}"
          unzip -l "${AK3_ZIP}" | grep -q ' LICENSE$'
          unzip -l "${AK3_ZIP}" | grep -q ' Image$'
          unzip -l "${AK3_ZIP}" | grep -q ' tools/busybox$'
          unzip -l "${AK3_ZIP}" | grep -q ' tools/magiskboot$'
          sha256sum "${AK3_ZIP}" > "${AK3_ZIP}.sha256"

      - name: Upload AnyKernel3 package
        uses: actions/upload-artifact@v4
        with:
          name: AnyKernel3-LineageOS-6.1.174-Docker-Ace5
          path: |
            AnyKernel3-LineageOS-6.1.174-Docker-Ace5.zip
            AnyKernel3-LineageOS-6.1.174-Docker-Ace5.zip.sha256

      - name: Upload debug files
        uses: actions/upload-artifact@v4
        with:
          name: giuliac-lineage-6.1.174-docker-debug
          path: |
            Image
            kernel.config
